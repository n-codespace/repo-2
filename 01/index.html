<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Skill Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container nav-container">
      <h2 class="logo">DevPortfolio<span>.js</span></h2>
      <button id="themeToggle" class="btn-secondary">Toggle Dark Mode</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container hero-content">
      <h1>Hello, I'm <span class="highlight">Alex Sharma</span></h1>
      <p class="subtitle">MCA Student & Full-Stack JavaScript Developer</p>
      <p class="bio">Passionate about building responsive web apps, DevOps pipelines, and cloud solutions.</p>
      <a href="#projects" class="btn-primary">View My Projects</a>
    </div>
  </section>

  <!-- Skills Section -->
  <section id="skills" class="skills-section">
    <div class="container">
      <h2>Technical Skills</h2>
      <div class="skills-grid" id="skillsGrid">
        <!-- Rendered dynamically by JavaScript -->
      </div>
    </div>
  </section>

  <!-- Projects Section -->
  <section id="projects" class="projects-section">
    <div class="container">
      <h2>Featured Projects</h2>
      <div class="projects-grid" id="projectsGrid">
        <!-- Rendered dynamically by JavaScript -->
      </div>
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="contact-section">
    <div class="container">
      <h2>Get In Touch</h2>
      <form id="contactForm" class="contact-form">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>
        <textarea id="message" rows="4" placeholder="Your Message" required></textarea>
        <button type="submit" class="btn-primary">Send Message</button>
      </form>
      <p id="formStatus" class="status-msg"></p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Alex Sharma. Built with JavaScript & Node.js.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
