<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Web App Deployment</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0078d4, #002050);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 { margin-bottom: 10px; font-size: 2rem; }
        p { color: #e0e7ff; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #107c41;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Microsoft Azure</h1>
        <h2>Web App Deployed Successfully!</h2>
        <p>This web application is hosted on <strong>Azure App Service (PaaS)</strong> with high availability, automated patching, and global scaling.</p>
        <span class="badge">Status: Live & Healthy</span>
    </div>
</body>
</html>
