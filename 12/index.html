<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AKS Cloud Application</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f172a, #1e3a8a); color: white; text-align: center; padding-top: 80px; }
        .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(8px); display: inline-block; padding: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); }
        h1 { color: #60a5fa; }
        .badge { background: #2563eb; padding: 6px 14px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Azure Kubernetes Service (AKS)</h1>
        <h2>Application Live on Azure Cloud!</h2>
        <p>Orchestrated by Kubernetes across managed cloud worker nodes and load balanced with Azure Public IP.</p>
        <span class="badge">Cloud Production Deployment</span>
    </div>
</body>
</html>
